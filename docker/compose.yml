services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: roadwatch
      POSTGRES_PASSWORD: roadwatch_dev
      POSTGRES_DB: roadwatch
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - roadwatch-data:/var/lib/postgresql/data
volumes:
  roadwatch-data:
